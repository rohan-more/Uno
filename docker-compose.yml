services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: localdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 3s
      timeout: 3s
      retries: 10

  nakama:
    build: ./server
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ecx
      - >
        /nakama/nakama migrate up --database.address postgres:localdb@postgres:5432/nakama &&
        exec /nakama/nakama --config /nakama/data/local.yml --database.address postgres:localdb@postgres:5432/nakama
    # Host ports can be overridden (e.g. NAKAMA_HTTP_PORT=7450) if another Nakama is already running.
    ports:
      - "${NAKAMA_GRPC_PORT:-7349}:7349"    # gRPC API
      - "${NAKAMA_HTTP_PORT:-7350}:7350"    # HTTP API + realtime socket (what Unity connects to)
      - "${NAKAMA_CONSOLE_PORT:-7351}:7351" # Developer console
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
